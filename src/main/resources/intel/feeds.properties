# Threat-intelligence feeds (checked 2026-10-28; re-check terms before shipping).
# Copy this file to <data folder>/feeds.properties to change it; entries there replace the ones below by name.
# Keys per feed:  url, format (cidr-lines | ndjson-cidr | ip-lines | hash-lines | json-field), kind (IP | CIDR | HASH),
#   enabled, interval.hours (how often to check), min.interval.minutes (never faster), header.name + header.env (an
#   optional request header whose value comes from that environment variable), allow.empty, c2 (hits score 90),
#   field (for json-field), allow.http (tests only), attribution (shown in the app: the terms require it).

# Spamhaus DROP: hijacked and criminal IPv4 netblocks. Free; credit The Spamhaus Project; update once a day.
feed.spamhaus-drop.url=https://www.spamhaus.org/drop/drop_v4.json
feed.spamhaus-drop.format=ndjson-cidr
feed.spamhaus-drop.kind=CIDR
feed.spamhaus-drop.enabled=true
feed.spamhaus-drop.interval.hours=24
feed.spamhaus-drop.min.interval.minutes=720
feed.spamhaus-drop.attribution=Spamhaus DROP list - (c) The Spamhaus Project (spamhaus.org)

# abuse.ch Feodo Tracker, "recommended" list of active botnet command-and-control servers (CC0). Often empty: that is
# normal. Never use the "aggressive" lists (false positives). Fetch at most every 15 minutes; daily is plenty.
feed.feodo-c2.url=https://feodotracker.abuse.ch/downloads/ipblocklist_recommended.txt
feed.feodo-c2.format=ip-lines
feed.feodo-c2.kind=IP
feed.feodo-c2.enabled=true
feed.feodo-c2.interval.hours=24
feed.feodo-c2.min.interval.minutes=15
feed.feodo-c2.allow.empty=true
feed.feodo-c2.c2=true
feed.feodo-c2.header.name=Auth-Key
feed.feodo-c2.header.env=ABUSECH_AUTH_KEY
feed.feodo-c2.attribution=Feodo Tracker by abuse.ch (CC0)

# URLhaus, MalwareBazaar and ThreatFox need a free abuse.ch account (auth.abuse.ch) and are for not-for-profit fair
# use. They stay off until you add an entry like this one with the download URL from your account page:
# feed.malwarebazaar-recent.url=<https download URL from your abuse.ch account>
# feed.malwarebazaar-recent.format=hash-lines
# feed.malwarebazaar-recent.kind=HASH
# feed.malwarebazaar-recent.enabled=true
# feed.malwarebazaar-recent.header.name=Auth-Key
# feed.malwarebazaar-recent.header.env=ABUSECH_AUTH_KEY
# feed.malwarebazaar-recent.attribution=MalwareBazaar by abuse.ch
